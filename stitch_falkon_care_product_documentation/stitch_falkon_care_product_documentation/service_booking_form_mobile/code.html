<!DOCTYPE html>

              "surface-container-highest": "#e0e3e5",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .step-active { width: 40%; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface font-body text-on-surface antialiased">
<!-- TopAppBar -->
<header class="fixed top-0 w-full flex justify-between items-center px-6 h-16 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl z-50 shadow-[0_10px_40px_rgba(25,28,30,0.06)]">
<div class="flex items-center gap-3">
<button class="material-symbols-outlined text-sky-700 dark:text-sky-400 active:scale-95 duration-200" data-icon="close">close</button>
<h1 class="font-headline font-bold tracking-tight text-xl font-extrabold text-sky-900 dark:text-sky-100">Falkon Care</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-highest overflow-hidden">
<img alt="User profile photo" class="w-full h-full object-cover" data-alt="professional headshot of a smiling man with a clean beard in a bright modern office setting" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDNJByi81T3wORO-I94vFWuATxqe_COk7WV9OKsMi6Bz0qjs_f971cbED34yQxbRw8NP7K5z5NMHMQI4O2MFHK3Ykj7XwWqTyWuSubZyeWxX5dEQW-VibjpnchdluKFNShrAXhv59822Dh8gvTQwMSzThwF_dlID417eWW6LGl2OL-tq8-KeKsJ8A7Nt6_u2VQkD_PNu_AniTGdxs65zKrehr9WRYJpGr43fiD2pm_Wcv_WI5qLPXFupgPF8WWWk6Vo4OunFpv9IJE"/>
</div>
</header>
<main class="pt-20 pb-40 px-6 max-w-md mx-auto">
<!-- Progress Indicator -->
<div class="mb-10">
<div class="flex justify-between items-end mb-3">
<div class="flex flex-col">
<span class="text-[10px] font-headline font-bold uppercase tracking-[0.15em] text-primary">Step 3 of 3</span>
<h2 class="text-2xl font-headline font-extrabold text-on-surface tracking-tight">Service Details</h2>
</div>
<div class="text-right">
<span class="text-xs font-bold text-on-surface-variant">90% Complete</span>
</div>
</div>
<div class="h-1.5 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-gradient-to-r from-primary to-primary-container rounded-full" style="width: 90%;"></div>
</div>
</div>
<!-- Form Step Container -->
<div class="space-y-10">
<!-- Step 3 Content (Active view for this demonstration) -->
<section class="space-y-8">
<!-- Service Type Selection -->
<div class="space-y-4">
<label class="block text-sm font-bold font-headline text-on-surface-variant ml-1">Select Service Category</label>
<div class="grid grid-cols-2 gap-3">
<button class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-lowest border-2 border-primary shadow-sm">
<span class="material-symbols-outlined text-primary mb-2 text-3xl" data-icon="sanitizer">sanitizer</span>
<span class="text-xs font-bold text-primary uppercase tracking-wider">Sanitization</span>
</button>
<button class="flex flex-col items-center justify-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container-highest transition-colors">
<span class="material-symbols-outlined text-on-surface-variant mb-2 text-3xl" data-icon="water_drop">water_drop</span>
<span class="text-xs font-bold text-on-surface-variant uppercase tracking-wider">Filtration</span>
</button>
</div>
</div>
<!-- Date & Time Large Picker -->
<div class="space-y-4">
<label class="block text-sm font-bold font-headline text-on-surface-variant ml-1">Preferred Appointment</label>
<div class="space-y-3">
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="calendar_month">calendar_month</span>
</div>
<input class="w-full pl-12 pr-4 py-5 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-medium text-on-surface placeholder:text-outline" placeholder="Select Date" type="text" value="October 24, 2024"/>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-outline" data-icon="schedule">schedule</span>
</div>
<select class="w-full pl-12 pr-4 py-5 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-medium text-on-surface appearance-none">
<option>Morning (09:00 AM - 12:00 PM)</option>
<option selected="">Afternoon (01:00 PM - 04:00 PM)</option>
<option>Evening (05:00 PM - 08:00 PM)</option>
</select>
</div>
</div>
</div>
<!-- Service Address -->
<div class="space-y-4">
<label class="block text-sm font-bold font-headline text-on-surface-variant ml-1">Service Address</label>
<div class="bg-surface-container-lowest rounded-xl p-5 shadow-[0_10px_40px_rgba(25,28,30,0.06)] border border-outline-variant/15">
<div class="flex items-start gap-4 mb-4">
<div class="w-10 h-10 rounded-full bg-primary/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary" data-icon="location_on" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
<div>
<h4 class="font-bold text-on-surface">Home Office</h4>
<p class="text-sm text-on-surface-variant leading-relaxed">4212 Tech Plaza, Suite 400<br/>San Francisco, CA 94103</p>
</div>
</div>
<button class="w-full py-3 rounded-lg bg-surface-container-high text-on-surface font-bold text-xs uppercase tracking-widest hover:bg-surface-container-highest transition-colors">
                            Change Address
                        </button>
</div>
</div>
<!-- Additional Instructions -->
<div class="space-y-4">
<label class="block text-sm font-bold font-headline text-on-surface-variant ml-1">Job Instructions (Optional)</label>
<textarea class="w-full p-5 bg-surface-container-highest border-none rounded-xl focus:ring-2 focus:ring-primary focus:bg-white transition-all font-medium text-on-surface placeholder:text-outline resize-none" placeholder="Mention specific access instructions or points of concern..." rows="4"></textarea>
</div>
</section>
</div>
</main>
<!-- Sticky Footer Actions -->
<div class="fixed bottom-0 left-0 w-full p-6 bg-white/70 dark:bg-slate-900/70 backdrop-blur-xl flex flex-col gap-3 shadow-[0_-10px_40px_rgba(25,28,30,0.06)] z-50">
<button class="w-full py-5 rounded-2xl bg-gradient-to-r from-primary to-primary-container text-white font-headline font-bold text-lg shadow-lg active:scale-95 transition-transform">
            Submit Job Request
        </button>
<button class="w-full py-4 rounded-xl bg-surface-container-high text-on-surface font-headline font-bold text-sm active:scale-95 transition-transform uppercase tracking-wider">
            Save Draft
        </button>
</div>
<!-- BottomNavBar (Suppressed as per "Task-Focused" exclusion rule) -->
<!-- Navigation Drawer is available via TopAppBar menu (Hidden by default) -->
<!-- Footer (Standard branding) -->
<footer class="w-full py-12 px-6 flex flex-col items-center gap-4 mb-24 bg-slate-100 dark:bg-slate-900 border-t border-slate-200/50 dark:border-slate-800/50">
<span class="font-bold text-sky-700">Falkon Care</span>
<div class="flex gap-6">
<a class="font-['Public_Sans'] text-xs text-slate-500 hover:text-sky-600 transition-colors" href="#">Privacy</a>
<a class="font-['Public_Sans'] text-xs text-slate-500 hover:text-sky-600 transition-colors" href="#">Terms</a>
<a class="font-['Public_Sans'] text-xs text-slate-500 hover:text-sky-600 transition-colors" href="#">Contact</a>
</div>
<p class="font-['Public_Sans'] text-xs text-slate-500">© 2024 Falkon Care platform</p>
</footer>
</body></html>
